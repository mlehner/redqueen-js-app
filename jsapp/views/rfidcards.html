<div class="btn-group pull-right">
  <a href="#/rfidcards/new" class="btn btn-primary"><i class="glyphicon glyphicon-plus"></i> New</a>
</div>
<table class="table table-striped">
  <thead>
  <tr>
    <th>Name</th>
    <th colspan="2">Card</th>
    <th>Active?</th>
    <td>&nbsp;</td>
  </tr>
  </thead>
  <tbody>
  <tr ng-show="(rfidCards.length) == 0">
    <td colspan="4">No RFID Cards added.</td>
  </tr>
  <tr ng-repeat="rfidCard in rfidCards">
    <td>
      <span class="lead">{{ rfidCard.name }}</span>
      <br />
      <span class="schedule-list">
        <span class="label" ng-repeat-start="schedule in rfidCard.schedules">{{ schedule.name }}</span> <span ng-repeat-end></span>
      </span>
    </td>
    <td>{{ rfidCard.facilityCode }}</td>
    <td>{{ rfidCard.cardNumber }}</td>
    <td>
      <span class="label label-success" ng-show="rfidCard.isActive">Yes</span>
      <span class="label label-danger" ng-hide="rfidCard.isActive">No</span>
    </td>
    <td>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-default" ng-click="edit(rfidCard)" aria-label="Edit">
          <span class="glyphicon glyphicon-pencil" aria-hidden="true"></span> Edit
        </button>
        <button class="btn btn-danger" ng-click="remove(rfidCard)" aria-label="Delete">
          <span class="glyphicon glyphicon-trash" aria-hidden="true"></span>
        </button>
      </div>
    </td>
  </tr>
  </tbody>
</table>
