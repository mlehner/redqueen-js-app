<div class="btn-group pull-right">
  <a href="#/schedules/new" class="btn btn-primary"><i class="glyphicon glyphicon-plus"></i> New</a>
</div>
<table class="table table-striped">
  <thead>
  <tr>
    <th colspan="10">Name</th>
    <td>&nbsp;</td>
  </tr>
  <tr>
    <th>Mon</th>
    <th>Tue</th>
    <th>Wed</th>
    <th>Thu</th>
    <th>Fri</th>
    <th>Sat</th>
    <th>Sun</th>
    <th>Start Time</th>
    <th>End Time</th>
    <th># of Cards</th>
    <td>&nbsp;</td>
  </tr>
  </thead>
  <tbody>
  <tr ng-show="(schedules.length) == 0">
    <td colspan="11">No schedules added.</td>
  </tr>
  <tr ng-repeat-start="schedule in schedules">
    <td colspan="10">
      <span class="lead">{{ schedule.name }}</span>
      <br />
      <span class="door-list">
        <span class="label" ng-repeat-start="door in schedule.doors">{{ door.name }}</span> <span ng-repeat-end></span>
      </span>
    </td>
  </tr>
  <tr ng-repeat-end>
    <td>
      <span class="label" ng-class="schedule.mon ? 'label-success' : 'label-danger'">Mon</span>
    </td>
    <td>
      <span class="label" ng-class="schedule.tue ? 'label-success' : 'label-danger'">Tue</span>
    </td>
    <td>
      <span class="label" ng-class="schedule.wed ? 'label-success' : 'label-danger'">Wed</span>
    </td>
    <td>
      <span class="label" ng-class="schedule.thu ? 'label-success' : 'label-danger'">Thu</span>
    </td>
    <td>
      <span class="label" ng-class="schedule.fri ? 'label-success' : 'label-danger'">Fri</span>
    </td>
    <td>
      <span class="label" ng-class="schedule.sat ? 'label-success' : 'label-danger'">Sat</span>
    </td>
    <td>
      <span class="label" ng-class="schedule.sun ? 'label-success' : 'label-danger'">Sun</span>
    </td>
    <td>{{ schedule.startTime }}</td>
    <td>{{ schedule.endTime }}</td>
    <td>{{ schedule.number_of_cards }}</td>
    <td class="actions">
      <div class="btn-group btn-group-sm">
        <button class="btn btn-default" ng-click="edit(schedule)" aria-label="Edit">
          <span class="glyphicon glyphicon-pencil" aria-hidden="true"></span> Edit
        </button>
      </div>
    </td>
  </tr>
  </tbody>
</table>
